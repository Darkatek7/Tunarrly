services:
  tunarrly:
    image: ghcr.io/darkatek7/tunarrly:latest
    # For local development builds, replace the image line with:
    # build: .
    container_name: tunarrly
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - /path/to/music:/music:ro
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
